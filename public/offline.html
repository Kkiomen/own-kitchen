<!doctype html>
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Brak połączenia — Kuchnia</title>
        <!--
            Served from the cache with no Blade around it, so the icon has to be
            named here too — otherwise the one screen you see when the phone
            drops signal is the one wearing a blank tab.
        -->
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <style>
            body {
                margin: 0;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 2rem;
                background: #ffffff;
                color: #17191a;
                font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
                text-align: center;
            }

            h1 {
                margin: 0 0 0.75rem;
                font-size: 1.5rem;
                font-weight: 600;
            }

            p {
                margin: 0 auto;
                max-width: 26rem;
                color: #5b6469;
                line-height: 1.6;
            }

            .mark {
                width: 3.5rem;
                height: 3.5rem;
                margin: 0 auto 1.5rem;
                border-radius: 1rem;
                background: #55b850;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="mark"></div>
            <h1>Brak połączenia</h1>
            <p>
                Przepisy, które już otwierałeś, są dostępne offline. Reszta
                wróci, gdy złapiesz sieć.
            </p>
        </main>
    </body>
</html>
