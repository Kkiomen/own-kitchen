<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kuchnia">
    <!--
        The same spoon and fork as the installed app's icon, redrawn as paths so
        it stays sharp at 16px in a browser tab. Palette tokens, not new colours:
        `accent` (#55b850) behind `ink` (#17191a) — the app icon, the manifest
        and theme_color are all that green, and a favicon that disagreed with
        them would read as a different app in the tab strip.
    -->
    <rect width="64" height="64" rx="12" fill="#55b850"/>
    <g fill="#17191a">
        <!-- Spoon: bowl, then handle. -->
        <ellipse cx="22" cy="22" rx="7.5" ry="9.5"/>
        <rect x="19" y="29" width="6" height="23" rx="3"/>

        <!-- Fork: three tines on a common shoulder, then handle. -->
        <rect x="33.4" y="12" width="3.6" height="13" rx="1.8"/>
        <rect x="39.2" y="12" width="3.6" height="13" rx="1.8"/>
        <rect x="45" y="12" width="3.6" height="13" rx="1.8"/>
        <path d="M33.4 23h15.2v5a4 4 0 0 1-4 4h-7.2a4 4 0 0 1-4-4z"/>
        <rect x="38" y="29" width="6" height="23" rx="3"/>
    </g>
</svg>
